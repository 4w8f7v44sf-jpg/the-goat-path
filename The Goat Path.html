section{animation:fi .8s both}@keyframes fi{from{opacity:0;transform:translateY(18px)}}

.num{font-family:Georgia,serif;font-size:2.6rem;color:var(--mut);display:block;line-height:1;margin-bottom:12px;transition:.3s}

ar:{sess:"حصصك تدوم {n} دقيقة مع استراحات حقيقية : مخّك يتعلّم أحسن بكتل صغيرة.",slot:["وقتك القوي الصباح : نحط المواد الصعيبة فيه.","وقتك القوي العشية : الصعيب بعد الغدوة.","وقتك القوي الليل : الصعيب فيه، ونحمي نومك."],mem:["تحفظ بالشوف : برشا رسومات ودروس متحرّكة.","تحفظ بالسمع : نخلّيك تشرح بصوت عالي وتسمع الدروس.","تحفظ بالعمل : التمارين قبل النظري."],calm:"الامتحانات تتعبك : الاختبارات تبدا أخفّ، مع تنفّس قبلها (شهيق 4 وزفير 6).",growth:"فكّر ‘موش توّا’ بدل ‘ما نجمش’ : كل غلطة معلومة لمخّك.",rest:"نومك قليل والنوم يثبّت الذاكرة. ثماني ساعات أفيد من المراجعة الليلية.",sup:"موش كل مرّة عندك شكون تحكي معاه. فكّر تحكي مع شخص كبير تثق فيه وإلا مرشد المعهد. وأنا هنا كذلك.",good:"بروفيل باهي : باش نقترحلك تحديات أصعب شوية باش تتقدّم بسرعة."}};
let QA={},qp=0;
function qrender(){const x=QT[L],last=PG.length;$("qs").textContent=x.s;$("tq").textContent=x.t[qp];$("qp").style.width=((qp+1)/(PG.length+1)*100)+"%";
let h="";if(qp<last)h=PG[qp].map(id=>`<div class="qi"><p>${QS[id][2][L]}</p><div class="row lk">${[1,2,3,4,5].map(v=>`<button class="chip ${QA[id]==v?"on":""}" data-q="${id}" data-v="${v}">${v}</button>`).join("")}</div><div class="ends"><span>${x.lo}</span><span>${x.hi}</span></div></div>`).join("");
else h=CHO.map(c=>`<div class="qi"><p>${c[2][L]}</p><div class="row" style="justify-content:flex-start">${c[3][L].map((o,i)=>`<button class="chip ${QA[c[0]]===i?"on":""}" data-c="${c[0]}" data-v="${i}">${o}</button>`).join("")}</div></div>`).join("");
$("qb").innerHTML=h;$("qback").textContent=x.b;$("qn").textContent=x.n}
function compute(){const D={focus:[],growth:[],calm:[],drive:[],support:[]};for(const id in QS){const v=QA[id];if(v){D[QS[id][0]].push(QS[id][1]?6-v:v)}}
const sc={};for(const k in D)sc[k]=D[k].length?Math.round((D[k].reduce((a,b)=>a+b)/D[k].length-1)/4*100):50;
sc.rest=QA.sleep!=null?CHO[0][1][QA.sleep]:50;S.scores=sc;S.mem=QA.mem??null;S.chr=QA.chr??null;S.mot=QA.mot??null;S.sess=sc.focus<45?15:sc.focus<70?25:35;save()}
function radar(){const x=QT[L],k=["focus","growth","calm","drive","rest","support"],sc=S.scores,R0=90,c=130;
const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return[c+Math.cos(a)*r,c+Math.sin(a)*r]};
const ring=[.33,.66,1].map(f=>`<polygon points="${k.map((_,i)=>pt(i,R0*f).join(",")).join(" ")}" fill="none" stroke="currentColor" opacity=".18"/>`).join("");
const poly=k.map((n,i)=>pt(i,R0*Math.max(.08,sc[n]/100)).join(",")).join(" ");
const lab=k.map((_,i)=>{const[p,q]=pt(i,R0+26);return`<text x="${p}" y="${q}" text-anchor="middle" font-size="12" fill="currentColor">${x.ax[i]}</text>`}).join("");
$("rad").innerHTML=`<svg viewBox="0 0 260 260" width="300" style="max-width:100%;color:var(--ink)">${ring}<polygon points="${poly}" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.6"/>${lab}</svg>`}
function advice(){const a=ADV[L],sc=S.scores,o=[a.sess.replace("{n}",S.sess)];if(S.chr!=null)o.push(a.slot[S.chr]);if(S.mem!=null)o.push(a.mem[S.mem]);if(sc.calm<50)o.push(a.calm);if(sc.growth<50)o.push(a.growth);if(sc.rest<50)o.push(a.rest);if(sc.support<40)o.push(a.sup);if(Object.values(sc).every(v=>v>=60))o.push(a.good);
$("adv").innerHTML=o.map(z=>`<div class="adv">✦ ${z}</div>`).join("")}
function showRes(){compute();radar();advice();$("tr").textContent=QT[L].tr;$("dr").textContent=QT[L].dr;$("rgo").textContent=QT[L].go}
$("qb").onclick=e=>{const d=e.target.dataset;if(d.q){QA[d.q]=+d.v;qrender()}else if(d.c){QA[d.c]=+d.v;qrender()}};
$("qn").onclick=()=>{if(qp<PG.length){qp++;qrender()}else{$("q").classList.add("hide");$("s2").classList.remove("hide")}};
$("qback").onclick=()=>{if(qp>0){qp--;qrender()}};
$("rgo").onclick=()=>{$("res").classList.add("hide");$("dash").classList.remove("hide");dash();plan();save()};

const TIPS={fr:[["Rappel actif","Ferme ton cahier et écris tout ce dont tu te souviens. Se tester apprend plus que relire.","Exemple : après un chapitre, 5 minutes pour réexpliquer à voix haute, sans notes."],["Répétition espacée","Revois une notion demain, dans 3 jours, puis dans 10 jours. Le cerveau garde ce qu’il revoit juste avant d’oublier.","Exemple : une formule de maths revue 3 fois vaut mieux qu’une nuit entière dessus."],["Technique de Feynman","Si tu sais l’expliquer simplement à un enfant, tu l’as compris.","Exemple : explique les limites avec une histoire de route qui s’approche d’une ville."],["Le sommeil fixe la mémoire","Pendant la nuit, le cerveau range ce que tu as appris. Dormir, c’est réviser.","Exemple : 20 minutes de révision, puis dormir, bat une nuit blanche."],["Erreur = information","Une erreur te montre exactement où ton cerveau doit encore grandir.","Exemple : note tes erreurs d’exercices dans une page « Mes trésors »."],["Petits pas","Commence par 10 minutes. Le plus dur, c’est de s’asseoir, pas d’étudier.","Exemple : « J’ouvre juste le chapitre » devient souvent une heure."],["Respire","Inspire 4 secondes, expire 6 secondes, trois fois. Le stress baisse et la mémoire revient.","Exemple : avant un examen, à ta place, sans que personne le voie."]],
en:[["Active recall","Close your notebook and write everything you remember. Testing yourself teaches more than rereading.","Example: after a chapter, spend 5 minutes re-explaining it aloud, no notes."],["Spaced repetition","Review an idea tomorrow, in 3 days, then in 10. The brain keeps what it revisits just before forgetting.","Example: a formula reviewed 3 times beats a whole night on it."],["The Feynman technique","If you can explain it simply to a child, you understood it.","Example: explain limits as a road getting closer to a city."],["Sleep locks memory","At night, your brain files what you learned. Sleeping is revising.","Example: 20 minutes of review then sleep beats an all-nighter."],["Mistake = information","A mistake shows exactly where your brain still has room to grow.","Example: keep a page called ‘My treasures’ for exercise errors."],["Small steps","Start with 10 minutes. The hard part is sitting down, not studying.","Example: ‘I’ll just open the chapter’ often becomes an hour."],["Breathe","Inhale 4 seconds, exhale 6, three times. Stress drops and memory returns.","Example: before an exam, at your desk, unseen."]],
ar:[["الاسترجاع النشط","سكّر كراسك واكتب كل ما تتذكّره. تختبر روحك أحسن من تعاود تقرا.","مثال : بعد كل فصل، خمس دقايق تعاود تشرحو بصوت عالي من غير ملاحظات."],["التكرار المتباعد","راجع الفكرة غدوة، بعد ثلاثة أيام، وبعد عشرة. المخ يحفظ اللي يراجعو قبل ما ينساه.","مثال : قانون في الرياضيات تراجعو ثلاث مرات أحسن من ليلة كاملة."],["طريقة فاينمان","كان تقدر تشرحها لطفل ببساطة، معناها فهمتها.","مثال : اشرح النهايات كطريق يقرّب من مدينة."],["النوم يثبّت الذاكرة","في الليل المخ يرتّب اللي تعلّمتو. النوم كيما المراجعة.","مثال : عشرين دقيقة مراجعة وبعد نوم أحسن من سهرة كاملة."],["الغلطة معلومة","الغلطة تبيّنلك وين مخّك لازم يكبر.","مثال : اكتب أغلاطك في ورقة اسمها ‘كنوزي’."],["خطوات صغيرة","ابدأ بعشر دقايق. الصعيب في القعدة، موش في القراية.","مثال : ‘نحل الفصل برك’ برشا مرّات تولّي ساعة."],["تنفّس","شهيق أربع ثواني وزفير ست ثواني، ثلاث مرّات. التوتر ينقص والذاكرة ترجع.","مثال : قبل الامتحان في بلاصتك من غير ما حد يشوف."]]};
const LES={fr:{t:"Suites arithmétiques — leçon d’exemple",s:[["Une suite, c’est quoi ?","Une liste de nombres rangés : u₀, u₁, u₂…",["3","7","11","15"]],["Arithmétique","On ajoute toujours la même raison r : uₙ₊₁ = uₙ + r. Ici r = 4.",["+4","+4","+4"]],["Le terme général","uₙ = u₀ + n × r. Donc u₁₀ = 3 + 10 × 4 = 43.",["u₁₀ = 43"]],["La somme","S = (n+1)(u₀ + uₙ) / 2. Un seul calcul au lieu de tout additionner.",["Σ"]]]},
en:{t:"Arithmetic sequences — sample lesson",s:[["What is a sequence?","An ordered list of numbers: u₀, u₁, u₂…",["3","7","11","15"]],["Arithmetic","We always add the same step r: uₙ₊₁ = uₙ + r. Here r = 4.",["+4","+4","+4"]],["The general term","uₙ = u₀ + n × r. So u₁₀ = 3 + 10 × 4 = 43.",["u₁₀ = 43"]],["The sum","S = (n+1)(u₀ + uₙ) / 2. One calculation instead of adding everything.",["Σ"]]]},
ar:{t:"المتتاليات الحسابية — درس تجريبي",s:[["شنوّة المتتالية ؟","قائمة أعداد مرتّبة : u₀ ، u₁ ، u₂…",["3","7","11","15"]],["حسابية","نزيدو دايما نفس الأساس r : uₙ₊₁ = uₙ + r. هنا r = 4.",["+4","+4","+4"]],["الحد العام","uₙ = u₀ + n × r. يعني u₁₀ = 3 + 10 × 4 = 43.",["u₁₀ = 43"]],["المجموع","S = (n+1)(u₀ + uₙ) / 2. عملية وحدة بدل ما نجمعو الكل.",["Σ"]]]}};
let tipI=Math.floor(Math.random()*7),sc=0,tm=null,playing=true,voice=true;
function tip(){const [a,b,c]=TIPS[L][tipI%7];$("tip").innerHTML=`<small>${t().tipl}</small><q>${a}</q><p>${b}</p><p><i>${c}</i></p><button class="btn" id="nx">${t().another}</button>`;$("nx").onclick=()=>{tipI++;tip()}}
function scene(){const s=SC()[sc];$("stg").innerHTML=`<small class="mut">${cur}</small><h3>${s[0]}</h3><div class="nums">${s[2].map((n,i)=>`<span style="animation-delay:${i*.4}s">${n}</span>`).join("")}</div><div class="big" style="font-size:1rem;color:var(--mut);max-width:520px">${s[1]}</div>`;
$("pg").style.width=((sc+1)/SC().length*100)+"%";$("lt").textContent=`${sc+1}/${SC().length}`;
if(voice&&window.speechSynthesis){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s[0]+". "+s[1]);u.lang=L=="ar"?"ar-TN":L=="fr"?"fr-FR":"en-US";speechSynthesis.speak(u)}catch(e){}}
clearTimeout(tm);if(playing)tm=setTimeout(()=>{if(sc<SC().length-1){sc++;scene()}},7500)}
const SC=()=>LS||LES[L].s;
function openLesson(n){cur=n||"";sc=0;playing=true;$("pp").textContent="⏸";$("lpr").textContent=X().tb[2];$("lesson").classList.add("open");scene()}
$("lx").onclick=()=>{$("lesson").classList.remove("open");clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}};
$("pp").onclick=()=>{playing=!playing;$("pp").textContent=playing?"⏸":"▶";if(playing)scene();else clearTimeout(tm)};
$("rp").onclick=()=>{sc=0;playing=true;$("pp").textContent="⏸";scene()};
$("vo").onclick=()=>{voice=!voice;$("vo").textContent=voice?"🔊":"🔇";if(!voice)try{speechSynthesis.cancel()}catch(e){}};
$("lpr").onclick=()=>{$("lesson").classList.remove("open");clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}tab(2)};

function save(){try{localStorage.setItem("najah",JSON.stringify(S));localStorage.setItem("lang",L)}catch(e){}}
function ui(){const x=t();document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l==L));
$("h1").innerHTML=x.h;$("hp").textContent=x.p;$("start").textContent=x.go;$("feat").innerHTML=x.f.map(f=>`<span class="chip">${f}</span>`).join("");
$("t1").textContent=x.t1;$("d1").textContent=x.d1;$("lname").textContent=x.nm;$("n1").textContent=x.nx;
$("t2").textContent=x.t2;$("d2").textContent=x.d2;$("lsp").textContent=x.sp;$("lmu").textContent=x.mu;$("lar").textContent=x.ar;$("lmo").textContent=x.mo;$("lst").textContent=x.st;$("lso").textContent=x.so;$("priv").textContent=x.pv;$("n2").textContent=x.fin;
$("social").innerHTML=x.soo.map((o,i)=>`<option value="${i}">${o}</option>`).join("");
$("lv").innerHTML=Object.keys(LV).map(k=>`<button class="chip ${S.lv==k?"on":""}" data-k="${k}">${x.lvl[k]}</button>`).join("");
if(!LV[S.lv].includes(S.sec))S.sec=LV[S.lv][0];
$("sc").innerHTML=LV[S.lv].map(k=>`<button class="chip ${S.sec==k?"on":""}" data-s="${k}">${SEC[k][L]}</button>`).join("");
$("tp").textContent=x.tp;$("mk").textContent=x.mk;$("pr").textContent=x.pr;$("ci").placeholder=x.ph;$("sq").placeholder=x.sq;
$("days").innerHTML=x.days.map((d,i)=>`<button class="chip ${S.days.includes(i)?"on":""}" data-d="${i}">${d}</button>`).join("");
tip();if(!$("q").classList.contains("hide"))qrender();if(!$("res").classList.contains("hide"))showRes();if(S.name&&!$("dash").classList.contains("hide"))dash();save()}
function dash(){const x=t();$("hi").textContent=x.hi(S.name);$("note").textContent=x.nt;
const now=new Date(),y=now.getFullYear(),up=HOL.map(([d,n])=>{let dt=new Date(`${y}-${d}`);if(dt<now)dt=new Date(`${y+1}-${d}`);return[dt,n]}).sort((a,b)=>a[0]-b[0]).slice(0,3);
$("cal").innerHTML="📅 "+x.cal+" : "+up.map(([d,n])=>`${n[L]} (${d.toLocaleDateString(L=="ar"?"ar-TN":L,{day:"numeric",month:"short"})})`).join(" · ");
homeView()}
function plan(){const x=t(),subs=subs_(),h=S.stress>3?1:2;let k=0;
$("plan").innerHTML=`<tr><th>${x.day}</th><th>${x.task}</th></tr>`+x.days.map((d,i)=>{if(!S.days.includes(i))return`<tr><td>${d}</td><td>${x.rest}</td></tr>`;
const id=subs[k%subs.length],ch=chl(id),a=sn(id),c=cn(ch[Math.floor(k/subs.length)%ch.length]);k++;return`<tr><td>${d}</td><td>${a} · ${c}<br><small class="mut">${x.st_[0]} → ${x.st_[1]} → ${x.st_[3]} · ${S.sess||25} min</small></td></tr>`}).join("")}
const R={fr:{greet:"Ahla ! Chnowa nkhdmou lyoum ? 😊",tired:"Ma tkhafch, khoudh nafas. 10 d9ayi9 ra7a w nkamel m3ak, 3la 9add ma t7eb.",plan:"Barcha khir ! A3mel ‘Générer mon plan’ w nraj3ou m3ak.",def:"Fhemtek. N7eb na3awnek : 9oulli 3al matiere wala chapitre w nebdaou b pré-test sghir."},en:{greet:"Ahla! What are we working on today? 😊",tired:"No stress, take a breath. 10 minutes of rest, then we go on at your pace.",plan:"Great idea! Tap ‘Generate my plan’ and we’ll tweak it together.",def:"Got you. Tell me the subject or chapter and we start with a small pre-test."},ar:{greet:"أهلا ! شنوّة نخدمو اليوم ؟ 😊",tired:"ما تخافش، خذ نفس. عشر دقايق راحة وبعد نكمّلو على قدّ ما تحب.",plan:"فكرة برشا باهية ! كبس على ‘اعمللي البرنامج’ ونعدّلوه مع بعضنا.",def:"فهمتك. قولّي على المادة وإلا الفصل ونبداو باختبار قبلي صغير."}};

$("langs").onclick=e=>{if(e.target.dataset.l){L=e.target.dataset.l;ui();if(S.name&&!$("dash").classList.contains("hide"))dash()}};

$("s2").classList.add("hide");$("res").classList.remove("hide");showRes();save();say("a",R[L].greet)};
